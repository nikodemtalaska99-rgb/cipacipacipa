version: "1"
project: discord-bot

components:
  - name: bot
    type: nodejs
    runtime: node-20
    run: node index.js
    env:
      TOKEN: ${TOKEN}
    mounts:
      # Mapujemy fizyczne miejsce na dysku do folderu /app/assets
      - path: /app/assets
        size: 1Gi
      # Mapujemy miejsce dla bazy danych quick.db
      - path: /app/json.sqlite
        size: 1Gi