diploiVersion: "v1.0"
project: discord-bot

components:
  - identifier: bot
    package: nodejs-20
    scripts:
      run: node index.js
    env:
      TOKEN: ${TOKEN}
    persistence:
      # To daje botowi uprawnienia do zapisu w /app/assets
      - path: /app/assets
        size: 1Gi
      # To zabezpiecza bazę danych quick.db
      - path: /app/json.sqlite
        size: 1Gi