diploiVersion: "v1.0"
project: discord-bot

components:
  - identifier: bot
    package: nodejs-20 # Łączy 'type' i 'runtime' w jedno pole
    
    # W nowej wersji używamy 'scripts' zamiast 'run'
    scripts:
      run: node index.js
    
    # Zmienne środowiskowe
    env:
      TOKEN: ${TOKEN}
    
    # Nowy format montowania wolumenów
    persistence:
      - path: /app/assets
        size: 1Gi
      - path: /app/json.sqlite
        size: 1Gi