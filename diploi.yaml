version: "1"
project: discord-bot

components:
  - name: bot
    type: nodejs
    runtime: node-20
    
    # Komenda startowa
    run: node index.js
    
    # Zmienne środowiskowe
    env:
      TOKEN: ${TOKEN}
    
    # Trwałe przechowywanie danych
    mounts:
      # To naprawia błąd EACCES dla /assets
      - path: /app/assets
        size: 1Gi
      
      # To chroni Twoją bazę danych quick.db
      - path: /app/json.sqlite
        size: 1Gi