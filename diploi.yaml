version: "1"
project: discord-bot

components:
  - name: bot
    type: nodejs
    runtime: node-20
    
    # Komenda startowa
    run: node index.js
    
    # Zmienne środowiskowe (TOKEN ustawisz w panelu Diploi)
    env:
      TOKEN: ${TOKEN}
    
    # Tutaj naprawiamy problem z uprawnieniami i zapisem danych:
    mounts:
      # Naprawa błędu /assets (mapujemy folder wewnątrz /app)
      - path: /app/assets
        size: 1Gi
      
      # Zapis bazy danych quick.db (często plik json.sqlite)
      - path: /app/json.sqlite
        size: 1Gi